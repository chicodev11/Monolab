<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monolab — Changelog</title>
<link rel="icon" href="shots/app-icon.png">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><img src="shots/app-icon.png" alt="">Monolab</a>
    <nav>
      <a class="nav-link" href="./#features"><span data-t>Features</span></a>
      <a class="nav-link" href="./#install"><span data-t>Install</span></a>
      <a class="nav-pill on" href="changelog"><span data-t>Changelog</span></a>
      <a class="nav-icon" href="https://github.com/chicodev11/Monolab" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
      </a>
      <span class="lang"><button data-set="en"></button><button data-set="ko"></button></span>
    </nav>
  </header>

  <section class="log-head">
    <h1><span data-t>Changelog</span></h1>
    <p><span data-t>Keep up with what's new in Monolab.</span></p>
    <div class="filters">
      <button class="on" data-kind="all"><span data-t>All</span></button>
      <button data-kind="app"><span data-t>App</span></button>
      <button data-kind="addon"><span data-t>Addon</span></button>
      <button data-kind="site"><span data-t>Website</span></button>
    </div>
  </section>

  <section id="log"></section>
  <footer>
    <span>Monolab</span>
    <a href="./"><span data-t>Home</span></a>
    <a href="https://github.com/chicodev11/Monolab">GitHub</a>
  </footer>
</div>
<script src="site.js"></script>
<script>
  const KINDS = { app: "App", addon: "Addon", site: "Website" };
  const SECTIONS = [
    ["added", "Added"],
    ["changed", "Changed"],
    ["fixed", "Fixed"],
    ["removed", "Removed"],
  ];
  let entries = [];
  let kind = "all";

  const escape = (text) => text.replace(/[&<>]/g, (one) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[one]);
  const inline = (text) => escape(text).replace(/`([^`]+)`/g, "<code>$1</code>");

  function when(date, lang) {
    const day = new Date(`${date}T00:00:00`);
    const label = day.toLocaleDateString(lang, { year: "numeric", month: "long", day: "numeric" });
    const days = Math.floor((Date.now() - day.getTime()) / 86400000);
    const ago = days <= 0 ? "" : days < 30 ? (days === 1 ? t("1 day ago") : t("{0} days ago", [days])) : "";
    return { label, ago };
  }

  function render() {
    const lang = document.documentElement.lang;
    const shown = entries.filter((one) => kind === "all" || one.kind === kind);
    document.getElementById("log").innerHTML = shown
      .map((one, index) => {
        const { label, ago } = when(one.date, lang);
        const title = one.version ? (one.kind === "addon" ? `v${one.version}` : one.version) : label;
        const date = [one.version ? label : "", ago].filter(Boolean).join(" · ");
        const items = SECTIONS.flatMap(([key, name]) =>
          (one[key] ?? []).map((item) => `<li><span class="tag ${key}">${t(name)}</span><span>${inline(t(item))}</span></li>`),
        ).join("");
        const fresh = index === 0 && kind === "all" ? `<span class="release-new">${t("Latest")}</span>` : "";
        return `<article class="release"><div class="release-side"><span class="release-kind">${t(KINDS[one.kind])}</span><span class="release-title${one.version ? "" : " small"}">${title}</span><span class="release-date">${date}</span>${fresh}</div><ul class="changes">${items}</ul></article>`;
      })
      .join("");
  }

  document.querySelectorAll(".filters button").forEach((button) =>
    button.addEventListener("click", () => {
      kind = button.dataset.kind;
      document.querySelectorAll(".filters button").forEach((one) => one.classList.toggle("on", one === button));
      render();
    }),
  );
  document.addEventListener("language", render);
  fetch("changelog.json")
    .then((answer) => answer.json())
    .then((list) => {
      entries = list;
      render();
    });
</script>
</body>
</html>
