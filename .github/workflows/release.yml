# Push a tag like v0.9.0 → builds the signed installer and publishes a GitHub Release with latest.json (the updater
# reads it from releases/latest/download/latest.json). Needs the repository secret TAURI_SIGNING_PRIVATE_KEY.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'chicodev11/Monolab'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Monolab v__VERSION__
          releaseBody: "What changed: https://chicodev11.github.io/Monolab/changelog.html"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
