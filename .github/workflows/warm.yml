# Builds the release profile on main so tag builds (release.yml) can restore a warm cache.
# Caches made on a tag are only visible to that tag; caches made on main are visible everywhere.
name: Release cache

on:
  push:
    branches: [main]
    paths: ["src-tauri/**", "package-lock.json", ".github/workflows/warm.yml"]
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

jobs:
  warm:
    if: github.repository == 'chicodev11/Monolab'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
      - run: npm ci
      - run: npx tauri build --no-bundle
