# Builds the release profile on main so tag builds (release.yml) can restore a warm cache.
# Caches made on a tag are only visible to that tag; caches made on main are visible everywhere.
name: Release cache

on:
  push:
    branches: [main]
    paths: ["src-tauri/**", "package-lock.json", ".github/workflows/warm.yml"]
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

jobs:
  warm:
    if: github.repository == 'chicodev11/Monolab'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: release
      - run: npm ci
      - run: npx tauri build --no-bundle
