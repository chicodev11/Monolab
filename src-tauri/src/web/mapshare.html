<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>World map</title>
<style>
  :root { color-scheme: dark; --bg: #0d0d0d; --panel: #1b1b1b; --raise: #2a2a2a; --text: #f2f2f2; --text2: #b4b4b4; --text3: #8a8a8a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
    background: repeating-conic-gradient(#0d0d0d 0% 25%, #141414 0% 50%) 50% / 24px 24px; }
  #view.drag { cursor: grabbing; }
  #view img { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  .box { position: fixed; z-index: 2; padding: 6px; border-radius: 12px; background: rgba(27, 27, 27, 0.94); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35); }
  #head { top: 12px; left: 12px; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; }
  #head strong { font-size: 15px; white-space: nowrap; }
  select { height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--raise); color: var(--text); font: inherit; }
  #tools { top: 12px; right: 12px; display: flex; flex-direction: column; gap: 2px; }
  #zoom { right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 2px; }
  button { display: grid; width: 36px; height: 36px; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--text2); font-size: 18px; cursor: pointer; }
  button:hover { background: var(--raise); color: var(--text); }
  button.on { background: var(--text); color: #000; }
  #where { left: 12px; bottom: 12px; padding: 8px 12px; color: var(--text2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #note { position: fixed; inset: 0; display: grid; place-items: center; color: var(--text3); pointer-events: none; }
  @media (max-width: 600px) { #head strong { display: none; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="note"></div>
<div id="head" class="box"><strong id="title"></strong><select id="realm"></select></div>
<div id="tools" class="box"><button id="night" title="">&#9790;</button></div>
<div id="zoom" class="box"><button id="in">+</button><button id="out">&minus;</button></div>
<div id="where" class="box"></div>
<script>
(() => {
  const TILE = 128, MIN = -4, MAX = 5, MAXV = 7;
  const base = location.pathname.replace(/\/+$/, "");
  const view = document.getElementById("view");
  const note = document.getElementById("note");
  const realmPick = document.getElementById("realm");
  const nightButton = document.getElementById("night");
  let labels = {};
  let realm = "overworld", night = false;
  let zoom = 0, cx = 0, cz = 0;
  const tiles = new Map();
  const say = (key, fallback) => labels[key] || fallback;

  const fetchJson = (path) => fetch(base + path).then((reply) => { if (!reply.ok) throw new Error(String(reply.status)); return reply.json(); });

  function draw() {
    const w = view.clientWidth, h = view.clientHeight;
    const bpp = 2 ** zoom;
    const level = Math.max(MIN, Math.min(MAX, Math.floor(zoom)));
    const span = TILE * 2 ** level;
    const left = cx - (w * bpp) / 2, top = cz - (h * bpp) / 2;
    const want = new Set();
    for (let ty = Math.floor(top / span); ty <= Math.floor((top + h * bpp) / span); ty += 1) {
      for (let tx = Math.floor(left / span); tx <= Math.floor((left + w * bpp) / span); tx += 1) {
        const key = `${realm}/${night ? 1 : 0}/${level}/${tx}/${ty}`;
        want.add(key);
        let img = tiles.get(key);
        if (!img) {
          img = new Image();
          img.alt = "";
          img.src = `${base}/tile?realm=${encodeURIComponent(realm)}&z=${level}&tx=${tx}&ty=${ty}&night=${night ? 1 : 0}`;
          tiles.set(key, img);
        }
        if (!img.isConnected) view.appendChild(img);
        const px = span / bpp;
        img.style.left = `${(tx * span - left) / bpp}px`;
        img.style.top = `${(ty * span - top) / bpp}px`;
        img.style.width = `${px + 0.5}px`;
        img.style.height = `${px + 0.5}px`;
      }
    }
    for (const [key, img] of tiles) if (!want.has(key) && img.isConnected) img.remove();
    if (tiles.size > 900) for (const [key, img] of tiles) if (!want.has(key)) { tiles.delete(key); if (tiles.size < 600) break; }
  }

  async function openRealm(next) {
    realm = next;
    for (const img of tiles.values()) img.remove();
    tiles.clear();
    note.textContent = say("loading", "Loading…");
    try {
      const [minX, minZ, maxX, maxZ] = await fetchJson(`/bounds?realm=${encodeURIComponent(realm)}`);
      cx = (minX + maxX) / 2;
      cz = (minZ + maxZ) / 2;
      const fit = Math.max(maxX - minX, maxZ - minZ) / Math.max(320, Math.min(view.clientWidth, view.clientHeight));
      zoom = Math.max(MIN, Math.min(MAX, Math.ceil(Math.log2(Math.max(fit, 1 / 16)))));
      note.textContent = "";
    } catch {
      note.textContent = say("missing", "This dimension has no map yet.");
    }
    draw();
  }

  let held = null;
  view.addEventListener("pointerdown", (event) => { held = { x: event.clientX, y: event.clientY }; view.setPointerCapture(event.pointerId); view.classList.add("drag"); });
  view.addEventListener("pointermove", (event) => {
    const bpp = 2 ** zoom;
    const x = Math.floor(cx + (event.clientX - view.clientWidth / 2) * bpp);
    const z = Math.floor(cz + (event.clientY - view.clientHeight / 2) * bpp);
    document.getElementById("where").textContent = `X ${x}   Z ${z}`;
    if (!held) return;
    cx -= (event.clientX - held.x) * bpp;
    cz -= (event.clientY - held.y) * bpp;
    held = { x: event.clientX, y: event.clientY };
    draw();
  });
  const release = () => { held = null; view.classList.remove("drag"); };
  view.addEventListener("pointerup", release);
  view.addEventListener("pointercancel", release);
  function zoomAt(next, sx, sy) {
    next = Math.max(MIN, Math.min(MAXV, next));
    const before = 2 ** zoom, after = 2 ** next;
    const ox = sx - view.clientWidth / 2, oy = sy - view.clientHeight / 2;
    cx += ox * (before - after);
    cz += oy * (before - after);
    zoom = next;
    draw();
  }
  view.addEventListener("wheel", (event) => { event.preventDefault(); zoomAt(zoom + (event.deltaY > 0 ? 0.5 : -0.5), event.clientX, event.clientY); }, { passive: false });
  document.getElementById("in").onclick = () => zoomAt(Math.round(zoom) - 1, view.clientWidth / 2, view.clientHeight / 2);
  document.getElementById("out").onclick = () => zoomAt(Math.round(zoom) + 1, view.clientWidth / 2, view.clientHeight / 2);
  nightButton.onclick = () => { night = !night; nightButton.classList.toggle("on", night); for (const img of tiles.values()) img.remove(); tiles.clear(); draw(); };
  realmPick.onchange = () => openRealm(realmPick.value);
  window.addEventListener("resize", draw);

  fetchJson("/info").then((info) => {
    labels = info.labels || {};
    document.documentElement.lang = labels.lang || "en";
    document.title = say("title", "World map").replace("{0}", info.name);
    document.getElementById("title").textContent = document.title;
    document.getElementById("in").title = say("zoomIn", "Zoom in");
    document.getElementById("out").title = say("zoomOut", "Zoom out");
    nightButton.title = say("night", "Night");
    for (const one of info.realms) {
      const option = document.createElement("option");
      option.value = one;
      option.textContent = labels["realm." + one] || one.replace(".", ":");
      realmPick.appendChild(option);
    }
    openRealm(info.realms.includes("overworld") ? "overworld" : info.realms[0] || "overworld");
  }).catch(() => { note.textContent = "This link is no longer shared."; });
})();
</script>
</body>
</html>
