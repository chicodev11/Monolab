[package]
name = "monolab-node"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Monolab node: lets a Monolink team reach Minecraft servers on a Linux machine while the host PC is off"

# Its own project, not part of another workspace.
[workspace]

[dependencies]
relay-proto = { path = "../crates/relay-proto" }
# Same iroh as the app (src-tauri/Cargo.toml), so both ends speak the same QUIC.
iroh = { version = "1.4", default-features = false, features = ["portmapper", "tls-aws-lc-rs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.9"
regex = "1.13"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Pairing and the address report to the account server (same HTTP stack as the app).
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
ed25519-dalek = "3.0.0"

[dev-dependencies]

[profile.release]
strip = true
